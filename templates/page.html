<!doctype html>
<html lang="{{language}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{title}}</title>
    <meta name="description" content="{{description}}" />
    <meta name="keywords" content="{{keywords}}" />
    <link rel="canonical" href="{{canonical_url}}" />
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; color: #1f2937; }
      .container { max-width: 860px; margin: 0 auto; padding: 24px; }
      .hero { background: #f3f4f6; border-radius: 10px; padding: 20px; }
      .cta { margin-top: 16px; }
      .cta a { background: #111827; color: #fff; text-decoration: none; padding: 10px 14px; border-radius: 8px; }
      .scan { margin-top: 10px; color: #374151; font-size: 14px; }
      .internal-links { margin-top: 24px; }
      .internal-links ul { padding-left: 18px; }
      footer { margin-top: 36px; font-size: 13px; color: #6b7280; }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="hero">
        <h1>{{h1}}</h1>
        <p>{{intro}}</p>
        <div class="cta">
          <a href="{{download_url}}" rel="nofollow">立即下载 {{app_name}}</a>
          <div class="scan">{{scan_text}}</div>
        </div>
      </section>

      <section class="internal-links">
        <h2>相关简历模板推荐</h2>
        <ul>
          {{internal_links_html}}
        </ul>
      </section>

      <footer>
        <p>© {{brand}} - SEO 静态落地页</p>
      </footer>
    </main>
  </body>
</html>
