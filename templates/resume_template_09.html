<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>简历模板09·09_夜空</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial;color:var(--text);padding:18px}
:root{--bg:#0b1120;--card:#111827;--primary:#6366f1;--primary2:#3730a3;--text:#e5e7eb;--muted:#cbd5e1;--line:#334155;--tag:#1e293b;}
h1{margin:0;font-size:34px}
.job{margin-top:8px;font-size:17px}
.header-right{font-size:14px;line-height:1.9}
.avatar{width:140px;height:180px;object-fit:cover;border:4px solid var(--line);border-radius:12px;background:#fff}
.basic-grid div span{font-weight:700;color:var(--primary2)}
.exp-item{margin-bottom:16px}
.exp-head{display:flex;justify-content:space-between;font-weight:700;gap:8px}
.exp-sub{margin-top:4px;color:var(--muted)}
ul{margin:8px 0 0 18px;padding:0} li{line-height:1.75}
.edu-item{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.edu-desc{margin-top:6px;margin-bottom:12px;color:var(--muted);line-height:1.75}
.desc{line-height:1.85}

.page{max-width:1080px;margin:22px auto;}
.header{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:28px 32px;border-radius:16px;display:flex;justify-content:space-between;margin-bottom:16px}
.section{padding:18px 22px;background:var(--card);border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.08);margin-bottom:14px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.title-left{background:var(--tag);color:var(--primary);padding:6px 14px;border-radius:10px;font-weight:700}
.title-right{width:48%;height:2px;background:var(--line)}
.basic-wrapper{display:flex;gap:20px;align-items:center}
.basic-grid{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:10px 18px;flex:1}

@media (max-width: 820px){
 .page{display:block!important;grid-template-columns:1fr!important}
 .header{display:block!important;grid-template-columns:1fr!important}
 .basic-wrapper{display:block!important}
 .basic-grid{grid-template-columns:1fr 1fr!important}
 .avatar{margin-top:10px}
}
</style>
</head>
<body>
<div class="page">
  <div class="header"><div class="header-left"><h1 id="name"></h1><div class="job">求职意向：<span id="job_intent"></span></div></div><div class="header-right"><div>📞 <span id="phone"></span></div><div>✉ <span id="email"></span></div><div>📍 <span id="location"></span></div></div></div>
<div class="section" id="basicSection"><div class="section-title"><div class="title-left">基本资料</div><div class="title-right"></div></div><div class="basic-wrapper"><div class="basic-grid"><div>出生年月：<span id="birthday"></span></div></div><img id="avatar" class="avatar"/></div></div>
<div class="section" id="selfSection"><div class="section-title"><div class="title-left">自我评价</div><div class="title-right"></div></div><div id="self_eval" class="desc"></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="section" id="jobsSection"><div class="section-title"><div class="title-left">工作经历</div><div class="title-right"></div></div><div id="jobs"></div></div><div class="section" id="projectsSection"><div class="section-title"><div class="title-left">项目经历</div><div class="title-right"></div></div><div id="projects"></div></div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="section" id="internshipsSection"><div class="section-title"><div class="title-left">实习经历</div><div class="title-right"></div></div><div id="internships"></div></div><div class="section" id="educationSection"><div class="section-title"><div class="title-left">教育背景</div><div class="title-right"></div></div><div id="education"></div></div></div>
</div>
<script>
function hideIfEmpty(id, arr){
    if(!arr || arr.length === 0){
        const node = document.getElementById(id);
        if(node) node.style.display = "none";
    }
}

function renderExperience(id, arr){
    const el = document.getElementById(id);
    if(!Array.isArray(arr) || !el) return;

    el.innerHTML = arr.map(i=>`
        <div class="exp-item">
            <div class="exp-head">
                <div>${i.org || ""} ${i.title ? " | " + i.title : ""}</div>
                <div>${i.time || ""}</div>
            </div>
            ${i.role ? `<div class="exp-sub">${i.role}</div>` : ""}
            ${Array.isArray(i.lines) ?
                `<ul>${i.lines.map(l=>`<li>${l}</li>`).join("")}</ul>` : ""}
        </div>
    `).join("");
}

function renderEducation(arr){
    const el = document.getElementById("education");
    if(!Array.isArray(arr) || !el) return;

    el.innerHTML = arr.map(i=>`
        <div class="edu-item">
            <div class="edu-left">
                ${i.org || ""} | ${i.title || ""}
            </div>
            <div>${i.time || ""}</div>
        </div>
        ${Array.isArray(i.lines)?
            `<div class="edu-desc">${i.lines.join("；")}</div>`:""}
    `).join("");
}

function setResumeData(d){
    document.getElementById("name").innerText = d.name || "";
    document.getElementById("job_intent").innerText = d.job_intent || "";
    document.getElementById("phone").innerText = d.phone || "";
    document.getElementById("email").innerText = d.email || "";
    document.getElementById("location").innerText = d.location || "";
    document.getElementById("birthday").innerText = d.birthday || "";
    document.getElementById("avatar").src = d.avatar || "";
    document.getElementById("self_eval").innerText = d.self_eval || "";

    renderExperience("jobs", d.jobs);
    renderExperience("internships", d.internships);
    renderExperience("projects", d.projects);
    renderEducation(d.education);

    hideIfEmpty("jobsSection", d.jobs);
    hideIfEmpty("internshipsSection", d.internships);
    hideIfEmpty("projectsSection", d.projects);
    hideIfEmpty("educationSection", d.education);
}
</script>
</body>
</html>
